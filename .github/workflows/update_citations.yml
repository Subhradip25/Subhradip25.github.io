name: Update Citation Data

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:       # Allows manual trigger from GitHub

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch citation data from Google Scholar
        run: python scripts/fetch_citations.py

      - - name: Commit and push updated citation data
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git pull --rebase origin main
          git add data/citations.json
          git diff --staged --quiet || git commit -m "Auto-update citations [skip ci]"
          git push
